apiVersion: v2
name: wordpress
description: A Helm chart for Wordpress on Kubernetes

type: application

# This is the chart version.
version: "0.9.9"

# Default image tag (image.tag overrides it). Must be a tag this repo's
# workflow publishes, i.e. the vX.Y.Z git tag without the "v"; the workflow
# fails a release whose tag doesn't match, so bump this before tagging.
appVersion: "1.2.5"

dependencies:
  - name: mariadb
    version: "0.3.14"
    repository: "https://groundhog2k.github.io/helm-charts"
    condition: mariadb.enabled
