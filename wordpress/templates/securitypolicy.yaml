{{- if and .Values.gateway.enabled .Values.gateway.securityPolicy.enabled -}}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: {{ include "wordpress.fullname" . }}
  labels:
    {{- include "wordpress.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ include "wordpress.fullname" . }}
  authorization:
    defaultAction: {{ .Values.gateway.securityPolicy.defaultAction | default "Allow" }}
    {{- with .Values.gateway.securityPolicy.rules }}
    rules:
      {{- toYaml . | nindent 6 }}
    {{- end }}
{{- end }}
