{{- if and .Values.gateway.enabled .Values.gateway.tls.enabled -}}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "wordpress.fullname" . }}
  labels:
    {{- include "wordpress.labels" . | nindent 4 }}
spec:
  secretName: {{ .Values.gateway.tls.secretName }}
  issuerRef:
    kind: {{ .Values.gateway.tls.issuerRef.kind }}
    name: {{ .Values.gateway.tls.issuerRef.name }}
  dnsNames:
    {{- range (.Values.gateway.tls.dnsNames | default .Values.gateway.hostnames) }}
    - {{ . | quote }}
    {{- end }}
{{- end }}
